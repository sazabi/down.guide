name: Feed, page, API or MCP bug
description: Something on down.guide is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem in down.guide itself? Email security@sazabi.ai instead of opening an issue.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Feed (RSS, Atom, JSON Feed)
        - Stack check
        - Website page or markdown copy
        - REST API
        - MCP server
        - Badge
        - Other
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL, request, or MCP tool call
      placeholder: https://down.guide/feed?provider=github&format=json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      description: Feed reader, browser, or agent and version.
